<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Spese-Flash 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5;color:#333}
        .container{max-width:480px;margin:0 auto;padding:1rem}
        .card{background:#fff;border-radius:8px;margin:.5rem 0;padding:.8rem;box-shadow:0 2px 4px rgba(0,0,0,.1)}
        header{background:#2c3e50;color:#fff;padding:1rem;text-align:center;border-radius:8px;margin-bottom:10px;font-weight:bold;}
        .stat-box { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        button{background:#27ae60;color:#fff;border:none;border-radius:4px;padding:.6rem;width:100%;cursor:pointer;margin-top:10px}
        .btn-extra{background:#3498db; width: 48%; display: inline-block; text-align: center; text-decoration: none; padding: 0.5rem; border-radius:4px; color:white; border:none; cursor:pointer; box-sizing: border-box;}
        ul{list-style:none;padding:0; font-size: 0.85rem;}
        li{border-bottom:1px solid #eee; padding:8px 0; display:flex; justify-content:space-between; align-items:center;}
    </style>
</head>
<body>

<div class="container">
    <header style="display:flex; justify-content:space-between; align-items:center;">
        <button onclick="cambiaMese(-1)" style="width:auto; margin:0;">⬅️</button>
        <span id="headerMese" style="flex-grow:1; text-align:center;"></span>
        <button onclick="cambiaMese(1)" style="width:auto; margin:0;">➡️</button>
    </header>

    <div class="card">
        <h3>➕ Aggiungi Spesa</h3>
        <input type="date" id="dataSpesa" style="width:100%; padding:8px; margin-bottom:5px; box-sizing:border-box;">
        <input type="number" id="importo" placeholder="Importo reale (€)" step="any" style="width:100%; padding:8px; margin-bottom:5px; box-sizing:border-box;">
        <select id="categoria" style="width:100%; padding:8px; margin-bottom:5px; box-sizing:border-box;">
            <option value="fisse-corrente">Fisse: Alimentari/Bollette</option>
            <option value="fisse-annuale">Fisse: RCA/Tagliando (1/12)</option>
            <option value="var-abbigliamento">Variabili: Abbigliamento/Mediche</option>
            <option value="var-ristorazione">Variabili: Ristorazione</option>
            <option value="var-altro">Variabili: Altro</option>
        </select>
        <input type="text" id="nota" placeholder="Nota" style="width:100%; padding:8px; box-sizing:border-box;">
        <button onclick="salvaSpesa()">✅ Salva</button>
    </div>

    <div class="card">
        <h3>📊 Riepilogo Mese</h3>
        <div id="riepilogo"></div>
        <div style="margin-top:15px; display:flex; justify-content:space-between;">
            <button class="btn-extra" onclick="esportaCSV()">📥 Esporta</button>
            <button class="btn-extra" style="background:#e67e22;" onclick="triggerImporta()">📤 Importa</button>
            <input type="file" id="fileCsvInput" accept=".csv" style="display:none" onchange="importaCSV(event)">
        </div>
    </div>

    <div class="card">
        <h3>📋 Voci inserite nel mese</h3>
        <ul id="listaSpese"></ul>
    </div>
</div>

<script>
const budget = { fisse: 800, variabili: 455 };
let spese = JSON.parse(localStorage.getItem('mieiDati')) || [];
let dataVisualizzata = new Date();
document.getElementById('dataSpesa').valueAsDate = new Date();

function cambiaMese(diff) {
    dataVisualizzata.setMonth(dataVisualizzata.getMonth() + diff);
    render();
}

function salvaSpesa() {
    const importo = parseFloat(document.getElementById('importo').value);
    const cat = document.getElementById('categoria').value;
    const nota = document.getElementById('nota').value.trim();
    const data = document.getElementById('dataSpesa').value;
    if(!importo || !data) { alert("Compila tutti i campi obbligatori"); return; }
    
    const impatto = cat === 'fisse-annuale' ? importo / 12 : importo;
    const tipo = cat.includes('fisse') ? 'fisse' : 'variabili';
    
    spese.push({ tipo, impatto, cat, nota, data, importoReale: importo });
    localStorage.setItem('mieiDati', JSON.stringify(spese));
    document.getElementById('importo').value = '';
    document.getElementById('nota').value = '';
    render();
}

function render() {
    const mesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
    document.getElementById('headerMese').innerText = `${mesi[dataVisualizzata.getMonth()]} ${dataVisualizzata.getFullYear()}`;
    
    const speseMese = spese.filter(s => {
        const d = new Date(s.data);
        return d.getMonth() === dataVisualizzata.getMonth() && d.getFullYear() === dataVisualizzata.getFullYear();
    });
    
    const dVis = new Date(dataVisualizzata.getFullYear(), dataVisualizzata.getMonth(), 1);
    const rateAnnuali = spese.filter(s => s.cat === 'fisse-annuale' && new Date(s.data) <= dVis);
    const totRate = rateAnnuali.reduce((acc, curr) => acc + curr.impatto, 0);
    
    let totMese = { fisse: 0, variabili: 0 };
    speseMese.forEach(s => totMese[s.tipo] += s.impatto);
    
    document.getElementById('riepilogo').innerHTML = `
        <div class="stat-box"><span>Quota fissa/annuale attiva:</span> <strong>${totRate.toFixed(2)}€</strong></div>
        <div class="stat-box"><span>Spese Fisse Mese:</span> <strong>${totMese.fisse.toFixed(2)}€</strong></div>
        <div class="stat-box" style="border-top: 2px solid #333; margin-top:5px;"><span>Residuo Budget Fisse:</span> <strong>${(budget.fisse - totMese.fisse - totRate).toFixed(2)}€</strong></div>
        <div class="stat-box"><span>Variabili (Consumate):</span> <strong>${totMese.variabili.toFixed(2)}€ / ${budget.variabili}€</strong></div>
    `;

    const lista = document.getElementById('listaSpese');
    lista.innerHTML = speseMese.map((s) => {
        const idx = spese.indexOf(s);
        const descrizione = s.nota ? s.nota : s.cat.replace('-', ': ');
        return `
            <li>
                <span>${s.data} | <strong>${s.importoReale}€</strong> (${descrizione})</span>
                <button onclick="elimina(${idx})" style="width:auto; padding:2px 8px; background:#e74c3c; margin:0;">X</button>
            </li>
        `;
    }).join('');
}

function elimina(i) { 
    if(confirm("Eliminare questa spesa?")) { 
        spese.splice(i, 1); 
        localStorage.setItem('mieiDati', JSON.stringify(spese)); 
        render(); 
    } 
}

function esportaCSV() {
    let csv = "Data,Tipo,Impatto,Categoria,Nota,ImportoReale\n" + spese.map(s => {
        const notaPulita = s.nota ? `"${s.nota.replace(/"/g, '""')}"` : '""';
        return `${s.data},${s.tipo},${s.impatto},${s.cat},${notaPulita},${s.importoReale}`;
    }).join("\n");
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); 
    a.href = url; 
    a.download = 'backup_spese.csv'; 
    a.click();
    URL.revokeObjectURL(url);
}

function triggerImporta() {
    document.getElementById('fileCsvInput').click();
}

function importaCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const lines = e.target.result.split('\n').slice(1);
            let nuoveSpese = [];
            
            for (let line of lines) {
                if (!line.trim()) continue;
                // Regex per gestire correttamente le virgole racchiuse tra virgolette nel campo nota
                const row = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                if (row.length >= 6) {
                    const data = row[0].trim();
                    const tipo = row[1].trim();
                    const impatto = parseFloat(row[2]);
                    const cat = row[3].trim();
                    let nota = row[4].trim().replace(/^"|"$/g, '').replace(/""/g, '"');
                    const importoReale = parseFloat(row[5]);
                    
                    nuoveSpese.push({ data, tipo, impatto, cat, nota, importoReale });
                }
            }
            
            if (nuoveSpese.length > 0) {
                spese = nuoveSpese;
                localStorage.setItem('mieiDati', JSON.stringify(spese));
                render();
                alert("Importazione completata con successo!");
            } else {
                alert("Nessun dato valido trovato nel file.");
            }
        } catch(err) {
            alert("Errore durante l'importazione del file CSV.");
        }
        event.target.value = ''; // Reset input file
    };
    reader.readAsText(file);
}

render();
</script>
</body>
</html>
